<!doctype html>
<body style="margin:0;background:#0b0620">
<svg id="s" viewBox="0 0 1080 1920"
 width="1080" height="1920">
 <defs>
  <radialGradient id="fl">
   <stop offset="0" stop-color="#fff7c2"/>
   <stop offset=".45" stop-color="#ffb327"/>
   <stop offset="1" stop-color="#ff5a00"
    stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sky" x2="0" y2="1">
   <stop offset="0" stop-color="#0b0620"/>
   <stop offset=".6" stop-color="#2a0a3d"/>
   <stop offset="1" stop-color="#6b1d2a"/>
  </linearGradient>
  <g id="clay">
   <path d="M-40 0Q0 64 40 0Z" fill="#b8501c"/>
   <ellipse rx="40" ry="9" fill="#e58a3e"/>
  </g>
  <g id="flame">
   <ellipse cy="-40" rx="52" ry="70" fill="url(#fl)">
    <animate attributeName="ry" dur="0.5s"
     values="70;58;76;64;70" repeatCount="indefinite"/>
   </ellipse>
   <path d="M0-4C-15-30-8-50 0-76C8-50 15-30 0-4Z"
    fill="#fff0a8"/>
  </g>
 </defs>
 <rect width="1080" height="1920" fill="url(#sky)"/>
 <circle cx="540" cy="860" r="0" fill="url(#fl)">
  <animate attributeName="r" begin="1s" dur="9s"
   to="760" fill="freeze"/>
  <animate attributeName="opacity" values=".1;.3;.1"
   dur="3s" repeatCount="indefinite"/>
 </circle>
 <g id="stars"></g>
 <g transform="translate(540 860)">
  <g id="diyas">
   <animateTransform attributeName="transform"
    type="scale" begin="10s" dur="1.6s"
    values="1;1.05;1;1.07;1" repeatCount="indefinite"/>
  </g>
  <text text-anchor="middle" y="-5" fill="#ffd46b"
   font-family="Poppins" font-weight="800"
   font-size="96" opacity="0">Happy
   <tspan x="0" dy="108">Diwali</tspan>
   <animate attributeName="opacity" begin="8.3s"
    dur="1.4s" to="1" fill="freeze"/>
  </text>
 </g>
</svg>
<script>
const heart = t => [
  16 * Math.sin(t) ** 3,
  -(13 * Math.cos(t) - 5 * Math.cos(2 * t)
    - 2 * Math.cos(3 * t) - Math.cos(4 * t))];
let out = "", when = 0.8;
for (const [k, n, sc] of [[28, 18, .8], [16, 10, .55]])
 for (let i = 0; i < n; i++, when += 0.24)
  for (const d of [1, -1]) {
   const [x, y] = heart(Math.PI + d * (i + .5)
                        * Math.PI / n);
   const T = `translate(${k * x} ${k * y})
    scale(${sc})`;
   out += `<use href="#clay" transform="${T}"/>
   <use href="#flame" transform="${T}" opacity="0">
   <animate attributeName="opacity" to="1" dur=".4s"
    begin="${when}s" fill="freeze"/></use>`;
  }
diyas.innerHTML = out;
for (let i = 0; i < 70; i++)
 stars.innerHTML += `<circle r="${1 + i % 3}"
  cx="${(i * 389) % 1080}" cy="${(i * 677) % 1500}"
  fill="#ffe9a8"><animate attributeName="opacity"
  values="1;.2;1" dur="${2 + i % 4}s"
  repeatCount="indefinite"/></circle>`;
</script>
